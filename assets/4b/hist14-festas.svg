<text x="450" y="58" font-size="34" fill="#ba376d" font-weight="800" text-anchor="middle">Brasil, um país festeiro</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">festas, lugares e origens</text>
