<text x="170" y="260" font-size="14" fill="#17213b" font-weight="700" text-anchor="middle">fev./mar.</text>
<text x="170" y="280" font-size="14" fill="#17213b" font-weight="700" text-anchor="middle">Rio é o maior do mundo</text>
