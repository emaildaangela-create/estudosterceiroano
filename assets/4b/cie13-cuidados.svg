<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="900" height="600" rx="28" fill="#fff9ec"/>
<text x="450" y="58" font-size="34" fill="#1d805c" font-weight="800" text-anchor="middle">Cuidados com o solo</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">uso responsável para as gerações futuras</text>
<rect x="30.0" y="95" width="270.0" height="225" rx="18" fill="#e8f6f0" stroke="#1d805c" stroke-width="3"/><text x="165.0" y="165" font-size="56" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🔄</text><text x="165.0" y="213" font-size="20" fill="#1d805c" font-weight="800" text-anchor="middle">Rotação de culturas</text><text x="165.0" y="243" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">alternar plantas</text><text x="165.0" y="265" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">na mesma área</text><rect x="315.0" y="95" width="270.0" height="225" rx="18" fill="#e8f6f0" stroke="#1d805c" stroke-width="3"/><text x="450.0" y="165" font-size="56" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🍂</text><text x="450.0" y="213" font-size="20" fill="#1d805c" font-weight="800" text-anchor="middle">Adubação orgânica</text><text x="450.0" y="243" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">restos de plantas</text><text x="450.0" y="265" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">enriquecem o solo</text><rect x="600.0" y="95" width="270.0" height="225" rx="18" fill="#e8f6f0" stroke="#1d805c" stroke-width="3"/><text x="735.0" y="165" font-size="56" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🌳</text><text x="735.0" y="213" font-size="20" fill="#1d805c" font-weight="800" text-anchor="middle">Controle da erosão</text><text x="735.0" y="243" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">reflorestar: raízes</text><text x="735.0" y="265" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">seguram o solo</text><rect x="30.0" y="335" width="270.0" height="225" rx="18" fill="#e8f6f0" stroke="#1d805c" stroke-width="3"/><text x="165.0" y="405" font-size="56" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">💦</text><text x="165.0" y="453" font-size="20" fill="#1d805c" font-weight="800" text-anchor="middle">Irrigação e drenagem</text><text x="165.0" y="483" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">água na medida</text><text x="165.0" y="505" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">certa para as raízes</text><rect x="315.0" y="335" width="270.0" height="225" rx="18" fill="#e8f6f0" stroke="#1d805c" stroke-width="3"/><text x="450.0" y="405" font-size="56" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🪱</text><text x="450.0" y="453" font-size="20" fill="#1d805c" font-weight="800" text-anchor="middle">Compostagem</text><text x="450.0" y="483" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">restos de alimentos</text><text x="450.0" y="505" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">viram adubo</text><rect x="600.0" y="335" width="270.0" height="225" rx="18" fill="#e8f6f0" stroke="#1d805c" stroke-width="3"/><text x="735.0" y="405" font-size="56" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🏞️</text><text x="735.0" y="453" font-size="20" fill="#1d805c" font-weight="800" text-anchor="middle">Unidades de Conservação</text><text x="735.0" y="483" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">áreas protegidas</text><text x="735.0" y="505" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">por lei (parques)</text>
</svg>
