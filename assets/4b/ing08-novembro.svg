<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="900" height="600" rx="28" fill="#fff9ec"/>
<text x="450" y="58" font-size="34" fill="#5b2c83" font-weight="800" text-anchor="middle">November Celebrations</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">duas festas de novembro</text>
<rect x="40" y="115" width="400" height="455" rx="24" fill="#fff4e6" stroke="#d9822b" stroke-width="3"/>
<text x="240" y="160" font-size="30" fill="#d9822b" font-weight="800" text-anchor="middle">Day of the Dead</text>
<text x="240" y="190" font-size="17" fill="#4a5872" font-weight="700" text-anchor="middle">Mexico · 1st of November</text>
<text x="160" y="285" font-size="74" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">💀</text><text x="240" y="285" font-size="64" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🕯️</text><text x="320" y="285" font-size="64" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🌼</text>
<text x="240" y="360" font-size="20" fill="#17213b" font-weight="700" text-anchor="middle">families remember the dead</text>
<text x="240" y="406" font-size="20" fill="#17213b" font-weight="700" text-anchor="middle">a big feast at the cemetery</text>
<text x="240" y="452" font-size="20" fill="#17213b" font-weight="700" text-anchor="middle">candles, music, candy skulls</text>
<text x="240" y="498" font-size="20" fill="#17213b" font-weight="700" text-anchor="middle">happy, not sad! 😊</text>
<rect x="460" y="115" width="400" height="455" rx="24" fill="#eef3ff" stroke="#6b49b8" stroke-width="3"/>
<text x="660" y="160" font-size="30" fill="#6b49b8" font-weight="800" text-anchor="middle">Yi Peng</text>
<text x="660" y="190" font-size="17" fill="#4a5872" font-weight="700" text-anchor="middle">Thailand · November</text>
<text x="580" y="290" font-size="60" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🏮</text><text x="660" y="260" font-size="52" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🏮</text><text x="740" y="295" font-size="60" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🏮</text><text x="660" y="315" font-size="44" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🎆</text>
<text x="660" y="360" font-size="20" fill="#17213b" font-weight="700" text-anchor="middle">a parade and costumes</text>
<text x="660" y="406" font-size="20" fill="#17213b" font-weight="700" text-anchor="middle">rice-paper lanterns in the sky</text>
<text x="660" y="452" font-size="20" fill="#17213b" font-weight="700" text-anchor="middle">lanterns take away bad things</text>
<text x="660" y="498" font-size="20" fill="#17213b" font-weight="700" text-anchor="middle">fireworks on the last day</text>
</svg>
