<text x="740" y="340" font-size="26" fill="#c0392b" font-weight="800" text-anchor="middle">ultraprocessado</text><text x="740" y="380" font-size="19" fill="#17213b" font-weight="700" text-anchor="middle">salgadinho de milho</text><text x="740" y="412" font-size="15" fill="#4a5872" font-weight="700" text-anchor="middle">muitos ingredientes da fábrica</text>
