<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="900" height="600" rx="28" fill="#fff9ec"/>
<defs><marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5872"/></marker></defs>
<text x="450" y="58" font-size="34" fill="#d9822b" font-weight="800" text-anchor="middle">Do natural ao ultraprocessado</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">o exemplo do milho</text>
<rect x="40" y="130" width="240" height="360" rx="24" fill="#e8f6f0" stroke="#1d805c" stroke-width="3"/><text x="160" y="270" font-size="96" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🌽</text>
<text x="160" y="340" font-size="26" fill="#1d805c" font-weight="800" text-anchor="middle">in natura</text><text x="160" y="380" font-size="19" fill="#17213b" font-weight="700" text-anchor="middle">espiga de milho</text><text x="160" y="412" font-size="15" fill="#4a5872" font-weight="700" text-anchor="middle">como vem da natureza</text>
<line x1="285" y1="300" x2="325" y2="300" stroke="#4a5872" stroke-width="3" stroke-linecap="round" marker-end="url(#ponta)"/>
<rect x="330" y="130" width="240" height="360" rx="24" fill="#fff4e6" stroke="#d9822b" stroke-width="3"/><text x="450" y="270" font-size="96" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🥫</text>
<text x="450" y="340" font-size="26" fill="#d9822b" font-weight="800" text-anchor="middle">processado</text><text x="450" y="380" font-size="19" fill="#17213b" font-weight="700" text-anchor="middle">milho em conserva</text><text x="450" y="412" font-size="15" fill="#4a5872" font-weight="700" text-anchor="middle">sal e água na lata</text>
