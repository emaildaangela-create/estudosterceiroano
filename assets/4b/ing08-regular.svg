<text x="450" y="58" font-size="34" fill="#2456b8" font-weight="800" text-anchor="middle">Regular verbs: + ed</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">verbos regulares no passado</text>
