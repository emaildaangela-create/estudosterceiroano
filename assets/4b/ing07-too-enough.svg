<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="900" height="600" rx="28" fill="#fff9ec"/>
<text x="450" y="58" font-size="34" fill="#2456b8" font-weight="800" text-anchor="middle">too much · too many · enough</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">demais · demais (que dá para contar) · o suficiente</text>
