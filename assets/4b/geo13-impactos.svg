<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="900" height="600" rx="28" fill="#fff9ec"/>
<text x="450" y="58" font-size="34" fill="#c0392b" font-weight="800" text-anchor="middle">Impactos ambientais da indústria</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">a indústria gera empregos e riqueza, mas pode poluir</text>
<rect x="30.0" y="120" width="198.75" height="200" rx="18" fill="#fff0f0" stroke="#c0392b" stroke-width="3"/><text x="129.375" y="190" font-size="60" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🏭</text><text x="129.375" y="238" font-size="20" fill="#c0392b" font-weight="800" text-anchor="middle">Poluição do ar</text><text x="129.375" y="268" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">fumaça das chaminés</text><rect x="243.75" y="120" width="198.75" height="200" rx="18" fill="#fff0f0" stroke="#c0392b" stroke-width="3"/><text x="343.125" y="190" font-size="60" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">💧</text><text x="343.125" y="238" font-size="20" fill="#c0392b" font-weight="800" text-anchor="middle">Contaminação</text><text x="343.125" y="268" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">das águas</text><rect x="457.5" y="120" width="198.75" height="200" rx="18" fill="#fff0f0" stroke="#c0392b" stroke-width="3"/><text x="556.875" y="190" font-size="60" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🌳</text><text x="556.875" y="238" font-size="20" fill="#c0392b" font-weight="800" text-anchor="middle">Uso excessivo</text><text x="556.875" y="268" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">dos recursos naturais</text><rect x="671.25" y="120" width="198.75" height="200" rx="18" fill="#fff0f0" stroke="#c0392b" stroke-width="3"/><text x="770.625" y="190" font-size="60" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🗑️</text><text x="770.625" y="238" font-size="20" fill="#c0392b" font-weight="800" text-anchor="middle">Muitos resíduos</text><text x="770.625" y="268" font-size="15" fill="#17213b" font-weight="700" text-anchor="middle">lixo e poluentes</text>
<rect x="30" y="360" width="840" height="200" rx="20" fill="#e8f6f0" stroke="#1d805c" stroke-width="3"/>
<text x="450" y="405" font-size="24" fill="#1d805c" font-weight="800" text-anchor="middle">Profissionais da indústria usam EPIs</text>
<text x="260" y="480" font-size="50" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">⛑️</text><text x="360" y="480" font-size="50" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🥽</text><text x="460" y="480" font-size="50" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🧤</text><text x="560" y="480" font-size="50" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🥾</text><text x="660" y="480" font-size="50" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">😷</text>
<text x="450" y="535" font-size="18" fill="#17213b" font-weight="700" text-anchor="middle">Equipamentos de Proteção Individual: segurança e saúde</text>
</svg>
