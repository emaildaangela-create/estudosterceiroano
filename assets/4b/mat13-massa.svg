<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="900" height="600" rx="28" fill="#fff9ec"/>
<defs><marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5872"/></marker></defs>
<text x="450" y="58" font-size="34" fill="#d9822b" font-weight="800" text-anchor="middle">Unidades de massa</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">da maior para a menor: cada degrau vale 1 000 do seguinte</text>
<rect x="40" y="135" width="190" height="425" rx="18" fill="#fff4e6" stroke="#d9822b" stroke-width="3"/>
<text x="135" y="205" font-size="52" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🚚</text><text x="135" y="260" font-size="40" fill="#d9822b" font-weight="800" text-anchor="middle">1 t</text>
<text x="135" y="293" font-size="19" fill="#17213b" font-weight="800" text-anchor="middle">tonelada</text><text x="135" y="540" font-size="15" fill="#4a5872" font-weight="700" text-anchor="middle">caminhão de carga</text>
<rect x="250" y="190" width="190" height="370" rx="18" fill="#fff4e6" stroke="#d9822b" stroke-width="3"/>
<text x="345" y="260" font-size="52" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🍚</text><text x="345" y="315" font-size="40" fill="#d9822b" font-weight="800" text-anchor="middle">1 kg</text>
<text x="345" y="348" font-size="19" fill="#17213b" font-weight="800" text-anchor="middle">quilograma</text><text x="345" y="540" font-size="15" fill="#4a5872" font-weight="700" text-anchor="middle">pacote de arroz</text>
<rect x="460" y="245" width="190" height="315" rx="18" fill="#fff4e6" stroke="#d9822b" stroke-width="3"/>
<text x="555" y="315" font-size="52" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">📎</text><text x="555" y="370" font-size="40" fill="#d9822b" font-weight="800" text-anchor="middle">1 g</text>
<text x="555" y="403" font-size="19" fill="#17213b" font-weight="800" text-anchor="middle">grama</text><text x="555" y="540" font-size="15" fill="#4a5872" font-weight="700" text-anchor="middle">um clipe de papel</text>
<rect x="670" y="300" width="190" height="260" rx="18" fill="#fff4e6" stroke="#d9822b" stroke-width="3"/>
<text x="765" y="370" font-size="52" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🥛</text><text x="765" y="425" font-size="40" fill="#d9822b" font-weight="800" text-anchor="middle">1 mg</text>
<text x="765" y="458" font-size="19" fill="#17213b" font-weight="800" text-anchor="middle">miligrama</text><text x="765" y="540" font-size="15" fill="#4a5872" font-weight="700" text-anchor="middle">sódio do iogurte</text>
<rect x="165" y="470" width="150" height="42" rx="21" fill="#d9822b" stroke="#fff" stroke-width="3"/><text x="240" y="498" font-size="19" fill="#fff" font-weight="800" text-anchor="middle">= 1 000 kg</text>
<rect x="375" y="470" width="150" height="42" rx="21" fill="#d9822b" stroke="#fff" stroke-width="3"/><text x="450" y="498" font-size="19" fill="#fff" font-weight="800" text-anchor="middle">= 1 000 g</text>
<rect x="585" y="470" width="150" height="42" rx="21" fill="#d9822b" stroke="#fff" stroke-width="3"/><text x="660" y="498" font-size="19" fill="#fff" font-weight="800" text-anchor="middle">= 1 000 mg</text>
