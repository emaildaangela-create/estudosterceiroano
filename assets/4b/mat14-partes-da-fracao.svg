<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="900" height="600" rx="28" fill="#fff9ec"/>
<defs><marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5872"/></marker></defs>
<text x="450" y="58" font-size="34" fill="#6b49b8" font-weight="800" text-anchor="middle">As partes da fração</text>
<rect x="80.0" y="150" width="80.0" height="150" fill="#38b6e0" stroke="#17213b" stroke-width="3"/><rect x="160.0" y="150" width="80.0" height="150" fill="#fff" stroke="#17213b" stroke-width="3"/><rect x="240.0" y="150" width="80.0" height="150" fill="#fff" stroke="#17213b" stroke-width="3"/><rect x="320.0" y="150" width="80.0" height="150" fill="#fff" stroke="#17213b" stroke-width="3"/>
<text x="240" y="345" font-size="22" fill="#17213b" font-weight="800" text-anchor="middle">4 partes iguais · 1 pintada</text>
<text x="600" y="237" font-size="90" fill="#6b49b8" font-weight="800" text-anchor="middle">1</text><line x1="559.5" y1="247" x2="640.5" y2="247" stroke="#6b49b8" stroke-width="4" stroke-linecap="round"/><text x="600" y="330.5" font-size="90" fill="#6b49b8" font-weight="800" text-anchor="middle">4</text>
<line x1="700" y1="195" x2="650" y2="205" stroke="#6b49b8" stroke-width="4" stroke-linecap="round" marker-end="url(#ponta)"/><line x1="700" y1="330" x2="650" y2="320" stroke="#6b49b8" stroke-width="4" stroke-linecap="round" marker-end="url(#ponta)"/>
<text x="715" y="185" font-size="24" fill="#6b49b8" font-weight="800" text-anchor="start">numerador</text><text x="715" y="212" font-size="18" fill="#4a5872" font-weight="700" text-anchor="start">partes pintadas</text>
<text x="715" y="335" font-size="24" fill="#6b49b8" font-weight="800" text-anchor="start">denominador</text><text x="715" y="362" font-size="18" fill="#4a5872" font-weight="700" text-anchor="start">partes iguais no total</text>
<rect x="80" y="430" width="740" height="120" rx="20" fill="#f1ecff" stroke="#6b49b8" stroke-width="3"/>
<text x="450" y="478" font-size="26" fill="#17213b" font-weight="800" text-anchor="middle">O traço da fração significa DIVISÃO.</text>
<text x="450" y="520" font-size="21" fill="#4a5872" font-weight="700" text-anchor="middle">Frações unitárias têm numerador 1:  1/2, 1/3, 1/4 … 1/10</text>
</svg>
