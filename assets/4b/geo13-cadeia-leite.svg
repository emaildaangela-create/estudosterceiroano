<text x="450" y="260" font-size="22" fill="#6b49b8" font-weight="800" text-anchor="middle">2. Transporte</text><text x="450" y="292" font-size="16" fill="#17213b" font-weight="700" text-anchor="middle">caminhão-tanque</text>
<line x1="577" y1="220" x2="608" y2="220" stroke="#6b49b8" stroke-width="4" stroke-linecap="round" marker-end="url(#ponta)"/>
<rect x="610" y="120" width="250" height="200" rx="20" fill="#f4effc" stroke="#6b49b8" stroke-width="3"/><text x="735" y="205" font-size="64" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🏭</text>
<text x="735" y="260" font-size="22" fill="#6b49b8" font-weight="800" text-anchor="middle">3. Indústria</text><text x="735" y="292" font-size="16" fill="#17213b" font-weight="700" text-anchor="middle">iogurte, queijo, manteiga</text>
<rect x="40" y="355" width="250" height="200" rx="20" fill="#f4effc" stroke="#6b49b8" stroke-width="3"/><text x="165" y="440" font-size="64" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">📦</text>
<text x="165" y="495" font-size="22" fill="#6b49b8" font-weight="800" text-anchor="middle">4. Distribuição</text><text x="165" y="527" font-size="16" fill="#17213b" font-weight="700" text-anchor="middle">caminhão leva às lojas</text>
