<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="900" height="600" rx="28" fill="#fff9ec"/>
<defs><marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5872"/></marker></defs>
<text x="450" y="58" font-size="34" fill="#6b49b8" font-weight="800" text-anchor="middle">Do leite da vaca ao consumidor</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">a cadeia de produção</text>
<rect x="40" y="120" width="250" height="200" rx="20" fill="#f4effc" stroke="#6b49b8" stroke-width="3"/><text x="165" y="205" font-size="64" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🐄</text>
<text x="165" y="260" font-size="22" fill="#6b49b8" font-weight="800" text-anchor="middle">1. Extração</text><text x="165" y="292" font-size="16" fill="#17213b" font-weight="700" text-anchor="middle">ordenha da vaca</text>
<line x1="292" y1="220" x2="323" y2="220" stroke="#6b49b8" stroke-width="4" stroke-linecap="round" marker-end="url(#ponta)"/>
