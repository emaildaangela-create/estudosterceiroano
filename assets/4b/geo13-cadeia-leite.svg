<text x="450" y="495" font-size="22" fill="#6b49b8" font-weight="800" text-anchor="middle">5. Comércio</text><text x="450" y="527" font-size="16" fill="#17213b" font-weight="700" text-anchor="middle">o mercado vende</text>
