<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="900" height="600" rx="28" fill="#fff9ec"/>
<defs><marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5872"/></marker></defs>
<text x="450" y="58" font-size="34" fill="#2456b8" font-weight="800" text-anchor="middle">Passado · presente · futuro</text><text x="450" y="90" font-size="19" fill="#4a5872" font-weight="600" text-anchor="middle">os tempos verbais</text>
<line x1="70" y1="330" x2="830" y2="330" stroke="#4a5872" stroke-width="6" stroke-linecap="round" marker-end="url(#ponta)"/>
<circle cx="170" cy="330" r="20" fill="#6b49b8"/>
<rect x="40" y="125" width="260" height="165" rx="20" fill="#fff" stroke="#6b49b8" stroke-width="3"/><text x="170" y="182" font-size="44" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">⏪</text><text x="170" y="228" font-size="26" fill="#6b49b8" font-weight="800" text-anchor="middle">PASSADO</text><text x="170" y="258" font-size="17" fill="#4a5872" font-weight="700" text-anchor="middle">já aconteceu</text>
<rect x="40" y="370" width="260" height="150" rx="20" fill="#fff" stroke="#6b49b8" stroke-width="2"/><text x="170" y="420" font-size="19" fill="#17213b" font-weight="800" text-anchor="middle">Ontem eu tive medo.</text><text x="170" y="470" font-size="17" fill="#6b49b8" font-weight="700" text-anchor="middle">fugiram · era · falou</text>
<circle cx="450" cy="330" r="20" fill="#1d805c"/>
<rect x="320" y="125" width="260" height="165" rx="20" fill="#fff" stroke="#1d805c" stroke-width="3"/><text x="450" y="182" font-size="44" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">⏺️</text><text x="450" y="228" font-size="26" fill="#1d805c" font-weight="800" text-anchor="middle">PRESENTE</text><text x="450" y="258" font-size="17" fill="#4a5872" font-weight="700" text-anchor="middle">acontece agora</text>
<rect x="320" y="370" width="260" height="150" rx="20" fill="#fff" stroke="#1d805c" stroke-width="2"/><text x="450" y="420" font-size="19" fill="#17213b" font-weight="800" text-anchor="middle">Hoje eu tenho medo.</text><text x="450" y="470" font-size="17" fill="#1d805c" font-weight="700" text-anchor="middle">fogem · é · fala</text>
<circle cx="730" cy="330" r="20" fill="#d9822b"/>
<rect x="600" y="125" width="260" height="165" rx="20" fill="#fff" stroke="#d9822b" stroke-width="3"/><text x="730" y="182" font-size="44" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">⏩</text><text x="730" y="228" font-size="26" fill="#d9822b" font-weight="800" text-anchor="middle">FUTURO</text><text x="730" y="258" font-size="17" fill="#4a5872" font-weight="700" text-anchor="middle">ainda vai acontecer</text>
<rect x="600" y="370" width="260" height="150" rx="20" fill="#fff" stroke="#d9822b" stroke-width="2"/><text x="730" y="420" font-size="19" fill="#17213b" font-weight="800" text-anchor="middle">Amanhã terei coragem!</text><text x="730" y="470" font-size="17" fill="#d9822b" font-weight="700" text-anchor="middle">fugirão · será · falará</text>
</svg>
